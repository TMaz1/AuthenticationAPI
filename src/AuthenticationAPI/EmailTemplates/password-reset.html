<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Password Reset</title>
</head>

<body>
    <h2>Password reset request</h2>
    <p>Hello,</p>
    <p>We received a request to reset the password for your account. Click the link below to set a new password.</p>

    <p><a href="{{LINK}}">Reset my password</a></p>

    <p>This link will expire in <strong>{{EXPIRY_MINUTES}} minutes</strong>. If you did not request a password reset, please ignore this email.</p>

    {{EMAIL_FOOTER}}
</body>

</html>
