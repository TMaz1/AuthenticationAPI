name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore
        run: dotnet restore AuthenticationAPI.sln

      - name: Verify formatting
        run: dotnet format AuthenticationAPI.sln --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build AuthenticationAPI.sln -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test AuthenticationAPI.sln -c Release --no-build
          --filter "Category=Unit"
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults/unit

      - name: Vulnerable packages
        run: ./scripts/vulnerability-check.sh

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/unit/*.trx

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-unit-test
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'Ci-Only-Passw0rd!x' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Ephemeral service container reachable only inside this job; the fallback value is not a secret.
      AUTHAPI_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD || 'Ci-Only-Passw0rd!x' }};TrustServerCertificate=true;Encrypt=false
      AUTHAPI_TEST_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - run: dotnet restore AuthenticationAPI.sln
      - run: dotnet build AuthenticationAPI.sln -c Release --no-restore

      - name: Integration tests (SQL Server + Redis)
        run: >
          dotnet test AuthenticationAPI.sln -c Release --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults/integration

      - name: Fail if integration tests were skipped
        run: |
          skipped=$(grep -o 'outcome="NotExecuted"' TestResults/integration/*.trx | wc -l || true)
          echo "skipped integration tests: $skipped"
          if [ "$skipped" -gt 0 ]; then echo "Integration tests must not be skipped in CI"; exit 1; fi

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/integration/*.trx
